<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Art - Galería Simultánea 3x3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Rejilla 3x3 a pantalla completa */
        .grid-galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 3px;
            background-color: #111;
        }

        .celda {
            background-color: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1a1a1a;
            transition: border-color 0.25s ease;
        }

        .celda:hover {
            border-color: #ff0055;
        }

        /* Transmisión en vivo desenfocada */
        .iframe-camara {
            width: 100%;
            height: 100%;
            border: none;
            filter: blur(11px);
            transform: scale(1.08);
            pointer-events: none;
        }

        /* Identificador fijo discreto en cada celda */
        .indicador-fijo {
            position: absolute;
            top: 8px;
            left: 10px;
            z-index: 4;
            font-size: 0.72rem;
            color: rgba(255, 234, 0, 0.65);
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Capa interactiva al pasar el cursor */
        .capa-interactiva {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.55);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .celda:hover .capa-interactiva {
            opacity: 1;
        }

        .etiqueta-sala {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffea00;
            text-shadow: 0 0 6px #ffea00;
        }

        .acciones-sala {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn-accion {
            background: #000;
            color: #ffea00;
            border: 1px solid #ffea00;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-accion:hover {
            background: #ffea00;
            color: #000;
        }

        .btn-entrar {
            background: #ff0055;
            color: #fff;
            border: 1px solid #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
        }

        .btn-entrar:hover {
            background: #fff;
            color: #ff0055;
        }
    </style>
</head>
<body>

    <div class="grid-galeria" id="gridGaleria"></div>

    <script>
        // Las 9 salas independientes ejecutándose de forma simultánea
        const totalSalas = 9;
        const grid = document.getElementById('gridGaleria');

        for (let i = 1; i <= totalSalas; i++) {
            const celda = document.createElement('div');
            celda.className = 'celda';

            // preview=1 evita que la galería ocupe un puesto de cámara en la sala
            const urlPreview = `cruissing.html?room=${i}&preview=1`;
            const urlSalaDirecta = `cruissing.html?room=${i}`;

            celda.innerHTML = `
                <span class="indicador-fijo">● SALA #0${i}</span>
                <iframe src="${urlPreview}"
                        class="iframe-camara"
                        allow="camera; microphone; autoplay"
                        title="Sala en vivo ${i}">
                </iframe>
                <div class="capa-interactiva">
                    <span class="etiqueta-sala">ESPACIO #0${i} — CONEXIÓN SIMULTÁNEA</span>
                    <div class="acciones-sala">
                        <button class="btn-accion" onclick="copiarEnlace(event, '${urlSalaDirecta}', this)">COPIAR LINK</button>
                        <button class="btn-accion btn-entrar" onclick="unirseASala('${urlSalaDirecta}')">ENTRAR</button>
                    </div>
                </div>
            `;

            grid.appendChild(celda);
        }

        function unirseASala(url) {
            window.location.href = url;
        }

        function copiarEnlace(evento, rutaRelativa, boton) {
            evento.stopPropagation();
            const urlCompleta = new URL(rutaRelativa, window.location.href).href;
            navigator.clipboard.writeText(urlCompleta).then(() => {
                const textoOriginal = boton.textContent;
                boton.textContent = '¡COPIADO!';
                setTimeout(() => {
                    boton.textContent = textoOriginal;
                }, 1500);
            });
        }
    </script>
</body>
</html>
