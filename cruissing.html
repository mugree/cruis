<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Net Art - Transmisión & Chat</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #000;
			color: #fff;
			font-family: 'Courier New', Courier, monospace;
			width: 100vw;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 15px;
			overflow: hidden;
		}

		/* SECCIÓN SUPERIOR: PANTALLAS DIVIDIDAS */
		.contenedor-superior {
			position: relative;
			display: flex;
			width: 100%;
			height: 60vh;
			gap: 20px;
		}

		.caja-pantalla {
			flex: 1;
			height: 100%;
			background-color: #000;
			border: none;
			border-radius: 0;
			box-shadow: none;
			overflow: hidden;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		/* Videos en vivo con efecto espejo */
		.caja-pantalla video {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transform: scaleX(-1); /* EFECTO ESPEJO */
		}

		/* Div de Carga / GIF en bucle */
		.pantalla-carga {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			background-color: #000;
		}

		.pantalla-carga img {
			max-width: 150px;
			max-height: 150px;
			object-fit: contain;
			margin-bottom: 10px;
		}

		.texto-esperando {
			color: #ffea00;
			font-size: 1.3rem;
			font-weight: bold;
			text-shadow: 0 0 10px #ffea00;
			letter-spacing: 2px;
			animation: parpadeo 1.5s infinite alternate;
		}

		@keyframes parpadeo {
			from { opacity: 0.4; }
			to { opacity: 1; }
		}

		/* GIF del Corazón interactivo en el centro */
		#gifCorazon {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			z-index: 10;
			width: 80px;
			height: 80px;
			cursor: pointer;
			border-radius: 50%;
			transition: transform 0.2s ease;
		}

		#gifCorazon:hover {
			transform: translate(-50%, -50%) scale(1.2);
		}

		/* SECCIÓN INFERIOR: CHAT */
		.contenedor-chat {
			width: 100%;
			height: 32vh;
			background-color: #000;
			border: none;
			border-radius: 0;
			box-shadow: none;
			display: flex;
			flex-direction: column;
			padding: 12px;
		}

		.chat-header {
			font-size: 1rem;
			color: #ff0055;
			margin-bottom: 8px;
			font-weight: bold;
		}

		#chatMensajes {
			flex: 1;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 8px;
			padding-right: 5px;
			margin-bottom: 10px;
		}

		.mensaje-item {
			background: transparent;
			padding: 6px 0;
			border: none;
			border-radius: 0;
			font-size: 0.95rem;
			color: #fff;
		}

		.chat-form {
			display: flex;
			gap: 10px;
		}

		#inputChat {
			flex: 1;
			padding: 10px 15px;
			background: #111;
			border: none;
			border-radius: 0;
			color: #fff;
			font-family: inherit;
			outline: none;
			box-shadow: none;
		}

		#btnEnviar {
			padding: 10px 20px;
			background: #222;
			color: #ffea00;
			border: none;
			border-radius: 0;
			font-family: inherit;
			font-weight: bold;
			cursor: pointer;
			box-shadow: none;
			transition: all 0.2s;
		}

		#btnEnviar:hover {
			background: #ffea00;
			color: #000;
		}
	</style>
</head>
<body>

	<!-- SECCIÓN SUPERIOR CON PANTALLAS DIVIDIDAS Y CORAZÓN CENTRAL -->
	<div class="contenedor-superior">
		<!-- LADO IZQUIERDO: CÁMARA LOCAL EN ESPEJO -->
		<div class="caja-pantalla">
			<video id="webcam1" autoplay playsinline muted></video>
		</div>

		<!-- CORAZÓN EN LA MITAD DE LAS DOS PANTALLAS -->
		<img id="gifCorazon" src="https://i.pinimg.com/originals/e2/5a/a0/e25aa0b26167091d4561ab78d3e43743.gif" alt="Corazón Interactivo">

		<!-- LADO DERECHO: GIF EN BUCLE HASTA QUE SE CONECTE OTRO USUARIO -->
		<div class="caja-pantalla">
			<div id="pantallaCarga" class="pantalla-carga">
				<img src="https://i.pinimg.com/originals/fb/f4/b4/fbf4b4b5b982c142d6b25d8bf45daa40.gif" alt="Esperando...">
				<div class="texto-esperando">esperando...</div>
			</div>
			<!-- El video remoto empieza oculto (display: none) -->
			<video id="webcam2" autoplay playsinline style="display: none;"></video>
		</div>
	</div>

	<!-- SECCIÓN INFERIOR: CHAT -->
	<div class="contenedor-chat">
		<div class="chat-header">💬 CHAT EN VIVO</div>
		<div id="chatMensajes">
			<div class="mensaje-item">Sistema: Sala de chat iniciada.</div>
		</div>
		<form id="formChat" class="chat-form">
			<input type="text" id="inputChat" placeholder="Escribe un mensaje..." autocomplete="off" required>
			<button type="submit" id="btnEnviar">Enviar</button>
		</form>
	</div>

	<script>
		const webcam1 = document.getElementById('webcam1');
		const webcam2 = document.getElementById('webcam2');
		const pantallaCarga = document.getElementById('pantallaCarga');
		const gifCorazon = document.getElementById('gifCorazon');
		const formChat = document.getElementById('formChat');
		const inputChat = document.getElementById('inputChat');
		const chatMensajes = document.getElementById('chatMensajes');

		// 1. Activar cámara local con efecto espejo
		async function iniciarCamaraLocal() {
			try {
				const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
				webcam1.srcObject = stream;
			} catch (e) {
				console.log('No se pudo acceder a la cámara:', e);
			}
		}
		iniciarCamaraLocal();

		// 2. Función para ocultar el GIF y activar el video cuando se conecta un usuario remoto
		function conectarUsuarioRemoto(streamRemoto) {
			pantallaCarga.style.display = 'none';
			webcam2.style.display = 'block';
			webcam2.srcObject = streamRemoto;
		}

		// Interacción con el GIF del Corazón
		gifCorazon.addEventListener('click', () => {
			agregarMensaje("Sistema", "❤️ ¡Enviaste un latido!");
		});

		// Funcionalidad del Chat
		function agregarMensaje(usuario, texto) {
			const div = document.createElement('div');
			div.className = 'mensaje-item';
			div.innerHTML = `<strong>${usuario}:</strong> ${texto}`;
			chatMensajes.appendChild(div);
			chatMensajes.scrollTop = chatMensajes.scrollHeight;
		}

		formChat.addEventListener('submit', (e) => {
			e.preventDefault();
			const texto = inputChat.value.trim();
			if (texto !== '') {
				agregarMensaje("Tú", texto);
				inputChat.value = '';
			}
		});
	</script>

</body>
</html>
