<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Net Art - Transmisión & Chat</title>
	<!-- Librería PeerJS para conexión WebRTC entre navegadores -->
	<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-color: #000;
			color: #fff;
			font-family: 'Courier New', Courier, monospace;
			width: 100vw;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 15px;
			overflow: hidden;
		}

		/* SECCIÓN SUPERIOR: PANTALLAS DIVIDIDAS */
		.contenedor-superior {
			position: relative;
			display: flex;
			width: 100%;
			height: 60vh;
			gap: 20px;
		}

		.caja-pantalla {
			flex: 1;
			height: 100%;
			background-color: #000;
			border: none;
			border-radius: 0;
			box-shadow: none;
			overflow: hidden;
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		/* Videos en vivo con efecto espejo */
		.caja-pantalla video {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transform: scaleX(-1);
		}

		/* Div de Carga / GIF en bucle */
		.pantalla-carga {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 100%;
			background-color: #000;
		}

		.pantalla-carga img {
			max-width: 150px;
			max-height: 150px;
			object-fit: contain;
			margin-bottom: 10px;
		}

		.texto-esperando {
			color: #ffea00;
			font-size: 1.3rem;
			font-weight: bold;
			text-shadow: 0 0 10px #ffea00;
			letter-spacing: 2px;
			animation: parpadeo 1.5s infinite alternate;
		}

		@keyframes parpadeo {
			from { opacity: 0.4; }
			to { opacity: 1; }
		}

		/* GIF del Corazón interactivo en el centro */
		#gifCorazon {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			z-index: 10;
			width: 80px;
			height: 80px;
			cursor: pointer;
			border-radius: 50%;
			transition: transform 0.2s ease;
		}

		#gifCorazon:hover {
			transform: translate(-50%, -50%) scale(1.2);
		}

		/* SECCIÓN INFERIOR: CHAT */
		.contenedor-chat {
			width: 100%;
			height: 32vh;
			background-color: #000;
			border: none;
			border-radius: 0;
			box-shadow: none;
			display: flex;
			flex-direction: column;
			padding: 12px;
		}

		.chat-header {
			font-size: 1rem;
			color: #ff0055;
			margin-bottom: 8px;
			font-weight: bold;
			display: flex;
			justify-content: space-between;
			align-items: center;
			flex-wrap: wrap;
			gap: 10px;
		}

		.controles-header {
			display: flex;
			align-items: center;
			gap: 18px;
		}

		/* Control de volumen de la radio (mínimo 20% real) */
		.radio-control {
			display: flex;
			align-items: center;
			gap: 8px;
			color: #ffea00;
			font-size: 0.85rem;
		}

		#controlVolumen {
			width: 90px;
			accent-color: #ffea00;
			cursor: pointer;
			background: transparent;
		}

		#estadoSala {
			color: #ffea00;
			font-size: 0.85rem;
		}

		#chatMensajes {
			flex: 1;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 8px;
			padding-right: 5px;
			margin-bottom: 10px;
		}

		.mensaje-item {
			background: transparent;
			padding: 6px 0;
			border: none;
			border-radius: 0;
			font-size: 0.95rem;
			color: #fff;
		}

		.chat-form {
			display: flex;
			gap: 10px;
		}

		#inputChat {
			flex: 1;
			padding: 10px 15px;
			background: #111;
			border: none;
			border-radius: 0;
			color: #fff;
			font-family: inherit;
			outline: none;
			box-shadow: none;
		}

		#btnEnviar {
			padding: 10px 20px;
			background: #222;
			color: #ffea00;
			border: none;
			border-radius: 0;
			font-family: inherit;
			font-weight: bold;
			cursor: pointer;
			box-shadow: none;
			transition: all 0.2s;
		}

		#btnEnviar:hover {
			background: #ffea00;
			color: #000;
		}
	</style>
</head>
<body>

	<!-- EMISORA NOCHES DE PELUCHEO EN VIVO -->
	<audio id="radioSala" src="https://az13.yesstreaming.net/listen/noches_de_pelucheo/radio.mp3" preload="auto"></audio>

	<!-- SECCIÓN SUPERIOR CON PANTALLAS DIVIDIDAS Y CORAZÓN CENTRAL -->
	<div class="contenedor-superior">
		<!-- LADO IZQUIERDO: CÁMARA LOCAL EN ESPEJO -->
		<div class="caja-pantalla">
			<video id="webcam1" autoplay playsinline muted></video>
		</div>

		<!-- CORAZÓN EN LA MITAD DE LAS DOS PANTALLAS -->
		<img id="gifCorazon" src="https://i.pinimg.com/originals/e2/5a/a0/e25aa0b26167091d4561ab78d3e43743.gif" alt="Corazón Interactivo">

		<!-- LADO DERECHO: GIF EN BUCLE HASTA QUE SE CONECTE OTRO USUARIO -->
		<div class="caja-pantalla">
			<div id="pantallaCarga" class="pantalla-carga">
				<img src="https://i.pinimg.com/originals/fb/f4/b4/fbf4b4b5b982c142d6b25d8bf45daa40.gif" alt="Esperando...">
				<div class="texto-esperando">esperando...</div>
			</div>
			<video id="webcam2" autoplay playsinline style="display: none;"></video>
		</div>
	</div>

	<!-- SECCIÓN INFERIOR: CHAT -->
	<div class="contenedor-chat">
		<div class="chat-header">
			<span>💬 CHAT EN VIVO</span>
			<div class="controles-header">
				<div class="radio-control" title="Volumen de Noches de Pelucheo">
					<span>📻</span>
					<input type="range" id="controlVolumen" min="0" max="100" value="20">
					<span id="textoVolumen">20%</span>
				</div>
				<span id="estadoSala">Conectando sala...</span>
			</div>
		</div>
		<div id="chatMensajes">
			<div class="mensaje-item">Sistema: Sala de chat iniciada.</div>
		</div>
		<form id="formChat" class="chat-form">
			<input type="text" id="inputChat" placeholder="Escribe un mensaje..." autocomplete="off" required>
			<button type="submit" id="btnEnviar">Enviar</button>
		</form>
	</div>

	<script>
		const webcam1 = document.getElementById('webcam1');
		const webcam2 = document.getElementById('webcam2');
		const pantallaCarga = document.getElementById('pantallaCarga');
		const estadoSala = document.getElementById('estadoSala');
		const gifCorazon = document.getElementById('gifCorazon');
		const formChat = document.getElementById('formChat');
		const inputChat = document.getElementById('inputChat');
		const chatMensajes = document.getElementById('chatMensajes');

		// URL directa de tu aplicación web de Google Apps Script
		const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytXfa-8GE5Kkkmcuz2dHUyT5lkKw5ObWSmzR82q31fZTfMZ6BGsHT3O6_cAOlQSHYY/exec';

		// Elementos de la Radio
		const radioSala = document.getElementById('radioSala');
		const controlVolumen = document.getElementById('controlVolumen');
		const textoVolumen = document.getElementById('textoVolumen');
		let radioIniciada = false;

		// =========================================================
		// 1. MÚSICA DE FONDO: NOCHES DE PELUCHEO (MÍNIMO 20% REAL)
		// =========================================================
		function actualizarVolumen(valorVisual) {
			const v = Math.max(0, Math.min(100, Number(valorVisual)));
			const volumenReal = 0.20 + (v / 100) * 0.80;
			radioSala.volume = volumenReal;
			textoVolumen.textContent = `${v}%`;
		}

		actualizarVolumen(controlVolumen.value);

		function iniciarRadio() {
			if (!radioIniciada) {
				radioSala.play().then(() => {
					radioIniciada = true;
				}).catch(() => {});
			}
		}

		iniciarRadio();
		['click', 'keydown', 'touchstart'].forEach(evento => {
			document.addEventListener(evento, iniciarRadio);
		});

		controlVolumen.addEventListener('input', (e) => {
			iniciarRadio();
			actualizarVolumen(e.target.value);
		});

		// =========================================================
		// 2. CONEXIÓN DE CÁMARAS Y SALA P2P (?room=1)
		// =========================================================
		const params = new URLSearchParams(window.location.search);
		const roomId = params.get('room') || '1';
		const hostPeerId = `mugree-cruis-sala-${roomId}`;

		const rtcConfig = {
			config: {
				iceServers: [
					{ urls: 'stun:stun.l.google.com:19302' },
					{ urls: 'stun:stun1.l.google.com:19302' }
				]
			}
		};

		let localStream = null;
		let conexionChat = null;

		function crearStreamRespaldo() {
			const canvas = document.createElement('canvas');
			canvas.width = 2;
			canvas.height = 2;
			const ctx = canvas.getContext('2d');
			ctx.fillStyle = '#000';
			ctx.fillRect(0, 0, 2, 2);
			return canvas.captureStream(1);
		}

		async function iniciarTodo() {
			try {
				localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
				webcam1.srcObject = localStream;
			} catch (e) {
				agregarMensaje("Sistema", "⚠️ Sin acceso a cámara local (modo espectador).");
				localStream = crearStreamRespaldo();
			}
			iniciarConexionSala();
		}

		function iniciarConexionSala() {
			const peer = new Peer(hostPeerId, rtcConfig);

			peer.on('open', () => {
				estadoSala.textContent = `SALA #${roomId} — Esperando pareja`;
				agregarMensaje("Sistema", `Conectado a Sala #${roomId}. Esperando a otra persona...`);
			});

			peer.on('call', (call) => {
				call.answer(localStream);
				call.on('stream', (remoteStream) => {
					conectarUsuarioRemoto(remoteStream);
				});
				call.on('close', desconectarUsuarioRemoto);
			});

			peer.on('connection', (conn) => {
				configurarChatP2P(conn);
			});

			peer.on('error', (err) => {
				if (err.type === 'unavailable-id') {
					peer.destroy();
					conectarComoInvitado();
				} else {
					console.error('Error PeerJS:', err);
				}
			});
		}

		function conectarComoInvitado() {
			const guestPeer = new Peer(rtcConfig);

			guestPeer.on('open', () => {
				estadoSala.textContent = `SALA #${roomId} — Conectando...`;
				const call = guestPeer.call(hostPeerId, localStream);

				call.on('stream', (remoteStream) => {
					conectarUsuarioRemoto(remoteStream);
				});
				call.on('close', desconectarUsuarioRemoto);

				const conn = guestPeer.connect(hostPeerId);
				configurarChatP2P(conn);
			});
		}

		function configurarChatP2P(conn) {
			conexionChat = conn;
			conn.on('open', () => {
				estadoSala.textContent = `SALA #${roomId} — EN VIVO`;
				agregarMensaje("Sistema", "🟢 Pareja conectada en la sala.");
			});
			conn.on('data', (datos) => {
				if (datos.tipo === 'chat') {
					agregarMensaje("Extraño", datos.texto);
				} else if (datos.tipo === 'latido') {
					agregarMensaje("Sistema", "❤️ La otra persona envió un latido.");
				}
			});
			conn.on('close', desconectarUsuarioRemoto);
		}

		function conectarUsuarioRemoto(streamRemoto) {
			pantallaCarga.style.display = 'none';
			webcam2.style.display = 'block';
			webcam2.srcObject = streamRemoto;
			webcam2.play().catch(() => {});
		}

		function desconectarUsuarioRemoto() {
			webcam2.style.display = 'none';
			webcam2.srcObject = null;
			pantallaCarga.style.display = 'flex';
			estadoSala.textContent = `SALA #${roomId} — Esperando pareja`;
			agregarMensaje("Sistema", "🔴 La otra persona salió de la sala.");
		}

		// =========================================================
		// 3. CAPTURAR AMBAS CÁMARAS EN BASE64 Y ENVIAR A APPS SCRIPT
		// =========================================================
		function capturarCamarasBase64() {
			const canvas = document.createElement('canvas');
			const anchoMitad = 240;
			const alto = 180;
			canvas.width = anchoMitad * 2; // 480x180 para respetar el límite de 50,000 caracteres por celda
			canvas.height = alto;

			const ctx = canvas.getContext('2d');
			ctx.fillStyle = '#000';
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			// Cámara 1 (Izquierda) en espejo
			if (webcam1.readyState >= 2) {
				ctx.save();
				ctx.translate(anchoMitad, 0);
				ctx.scale(-1, 1);
				ctx.drawImage(webcam1, 0, 0, anchoMitad, alto);
				ctx.restore();
			}

			// Cámara 2 (Derecha) en espejo si está conectada
			if (webcam2.style.display !== 'none' && webcam2.readyState >= 2) {
				ctx.save();
				ctx.translate(anchoMitad * 2, 0);
				ctx.scale(-1, 1);
				ctx.drawImage(webcam2, 0, 0, anchoMitad, alto);
				ctx.restore();
			} else {
				ctx.fillStyle = '#ffea00';
				ctx.font = 'bold 14px Courier New';
				ctx.textAlign = 'center';
				ctx.fillText('esperando...', anchoMitad + (anchoMitad / 2), alto / 2);
			}

			return canvas.toDataURL('image/jpeg', 0.65);
		}

		async function guardarLatidoEnSheets() {
			const imagenBase64 = capturarCamarasBase64();

			const payload = {
				hoja5: {
					foto: imagenBase64
				}
			};

			try {
				const response = await fetch(APPS_SCRIPT_URL, {
					method: 'POST',
					headers: {
						'Content-Type': 'text/plain;charset=utf-8'
					},
					body: JSON.stringify(payload)
				});

				if (!response.ok) {
					throw new Error('error');
				}

				const data = await response.json();

				if (data.status === 'error') {
					throw new Error(data.mensaje);
				}

				if (data.status === 'reset') {
					agregarMensaje("Sistema", "💾 Latido #50 guardado. Ciclo de hoja5 reiniciado.");
				} else {
					agregarMensaje("Sistema", `💾 Captura guardada (${data.total}/50).`);
				}
			} catch (err) {
				console.error('Error al guardar en hoja5:', err);
				agregarMensaje("Sistema", "error");
			}
		}

		// Interacción con el GIF del Corazón
		gifCorazon.addEventListener('click', () => {
			iniciarRadio();
			agregarMensaje("Sistema", "❤️ ¡Enviaste un latido!");
			if (conexionChat && conexionChat.open) {
				conexionChat.send({ tipo: 'latido' });
			}
			guardarLatidoEnSheets();
		});

		// Funcionalidad del Chat
		function agregarMensaje(usuario, texto) {
			const div = document.createElement('div');
			div.className = 'mensaje-item';
			div.innerHTML = `<strong>${usuario}:</strong> ${texto}`;
			chatMensajes.appendChild(div);
			chatMensajes.scrollTop = chatMensajes.scrollHeight;
		}

		formChat.addEventListener('submit', (e) => {
			e.preventDefault();
			iniciarRadio();
			const texto = inputChat.value.trim();
			if (texto !== '') {
				agregarMensaje("Tú", texto);
				if (conexionChat && conexionChat.open) {
					conexionChat.send({ tipo: 'chat', texto: texto });
				}
				inputChat.value = '';
			}
		});

		iniciarTodo();
	</script>

</body>
</html>
