<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ideas - Net Art</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'Courier New', Courier, monospace;
			background-color: #000000;
			color: #ffffff;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
		}

		/* ------------------------------------------------ */
		/* SECCIÓN 1: DIV 2 -> DIV 1 A PANTALLA COMPLETA    */
		/* ------------------------------------------------ */
		#seccionArte {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: #000;
			z-index: 100;
			cursor: pointer;
		}

		.caja-fullscreen {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 1.2s ease-in-out;
		}

		.caja-fullscreen.activa {
			opacity: 1;
			pointer-events: auto;
		}

		.caja-fullscreen img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		/* ------------------------------------------------ */
		/* SECCIÓN 2: MAPA OSCURO, NIEBLA Y LINTERNA        */
		/* ------------------------------------------------ */
		#seccionMapa {
			display: none;
			width: 100vw;
			min-height: 100vh;
			background-color: #000;
			padding: 40px 20px 140px 20px;
			flex-direction: column;
			align-items: center;
			overflow-y: auto;
			position: relative;
		}

		#seccionMapa.activa {
			display: flex;
		}

		.contenedor-mapa-wrapper {
			width: 90vw;
			max-width: 1100px;
			text-align: center;
			margin-bottom: 20px;
			position: relative;
		}

		.titulo-arriba-mapa {
			font-size: 20px;
			font-weight: normal;
			color: rgba(255, 255, 255, 0.25);
			margin-bottom: 15px;
			letter-spacing: 2px;
			transition: color 0.3s;
		}

		.subtitulo-abajo-mapa {
			font-size: 13px;
			color: rgba(255, 255, 255, 0.2);
			margin-top: 15px;
			margin-bottom: 80px;
			letter-spacing: 2px;
		}

		#mapaContenedor {
			position: relative;
			width: 100%;
			border: 1px solid #141414;
			overflow: hidden;
			cursor: crosshair;
			background-color: #000;
		}

		/* Imagen del mapa oscurecida */
		#mapaContenedor img {
			width: 100%;
			height: auto;
			display: block;
			filter: brightness(0.24) contrast(1.25) grayscale(0.35);
			user-select: none;
		}

		/* Capa de niebla atmosférica */
		.capa-niebla {
			position: absolute;
			top: -50%;
			left: -50%;
			width: 200%;
			height: 200%;
			background: 
				radial-gradient(circle at 30% 40%, rgba(180, 180, 180, 0.08), transparent 45%),
				radial-gradient(circle at 70% 60%, rgba(150, 150, 150, 0.09), transparent 50%),
				radial-gradient(circle at 50% 50%, rgba(200, 200, 200, 0.05), transparent 60%);
			filter: blur(25px);
			animation: movimientoNiebla 18s infinite alternate ease-in-out;
			pointer-events: none;
			z-index: 50;
		}

		@keyframes movimientoNiebla {
			0% { transform: translate(-4%, -3%) scale(1); }
			50% { transform: translate(3%, 4%) scale(1.05); }
			100% { transform: translate(-2%, 2%) scale(1.02); }
		}

		/* Máscara de oscuridad con circunferencia +50% (115px) y centro más claro */
		#capaOscuridadLinterna {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 60;
			background: radial-gradient(
				circle 115px at var(--x, -250px) var(--y, -250px),
				rgba(255, 255, 255, 0.35) 0%,
				rgba(255, 255, 255, 0.14) 35%,
				rgba(0, 0, 0, 0.62) 70%,
				rgba(0, 0, 0, 0.94) 100%
			);
		}

		/* ------------------------------------------------ */
		/* PUNTOS ROJOS Y TEXTO FIJO OPACO EN EL MAPA       */
		/* ------------------------------------------------ */
		.pin-wrapper {
			position: absolute;
			transform: translate(-50%, -50%);
			z-index: 120;
			display: flex;
			flex-direction: column;
			align-items: center;
			pointer-events: none;
		}

		.pin-comentario {
			width: 10px;
			height: 10px;
			background-color: #ff0000;
			border-radius: 50%;
			box-shadow: 0 0 8px #ff0000, 0 0 16px #ff0000;
			animation: pulsoBrillo 1.6s infinite alternate ease-in-out;
		}

		@keyframes pulsoBrillo {
			from { box-shadow: 0 0 4px #b30000, 0 0 8px #b30000; }
			to { box-shadow: 0 0 12px #ff1a1a, 0 0 22px #ff0000; }
		}

		/* Texto del comentario fijo en el mapa, muy opaco resaltando en la oscuridad */
		.texto-fijo-mapa {
			margin-top: 6px;
			color: rgba(255, 255, 255, 0.28);
			font-size: 11px;
			max-width: 160px;
			text-align: center;
			line-height: 1.2;
			text-shadow: 0 0 6px rgba(255, 255, 255, 0.35), 0 1px 2px #000;
			word-wrap: break-word;
			transition: color 0.3s ease, text-shadow 0.3s ease;
		}

		.pin-wrapper.iluminado .texto-fijo-mapa {
			color: rgba(255, 255, 255, 0.85);
			text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
		}

		/* Formulario Popup al hacer clic en el mapa */
		#popupComentario {
			display: none;
			position: absolute;
			background-color: #050505;
			border: 1px solid #444;
			padding: 12px;
			width: 230px;
			z-index: 500;
			transform: translate(-50%, -110%);
		}

		#popupComentario input[type="text"] {
			width: 100%;
			padding: 7px;
			margin-bottom: 8px;
			background-color: #0d0d0d;
			border: 1px solid #2a2a2a;
			color: #ccc;
			font-family: inherit;
			font-size: 12px;
			outline: none;
		}

		#popupComentario .botones-popup {
			display: flex;
			gap: 6px;
		}

		#popupComentario button {
			padding: 6px;
			font-size: 11px;
			border: 1px solid #444;
			background-color: #000;
			color: #aaa;
			cursor: pointer;
			flex: 1;
			font-family: inherit;
		}

		#popupComentario button:hover {
			background-color: #222;
			color: #fff;
		}

		/* ------------------------------------------------ */
		/* ENLACE ABAJO DEL MAPA                            */
		/* ------------------------------------------------ */
		.barra-enlace {
			width: 100%;
			max-width: 1100px;
			text-align: center;
			padding: 50px 0 30px 0;
			margin-top: 120px;
			border-top: 1px solid #141414;
		}

		.enlace-veo {
			color: #e2dfb5;
			opacity: 0.55;
			font-size: 1.3rem;
			text-decoration: underline;
			letter-spacing: 3px;
			cursor: pointer;
			transition: opacity 0.3s;
		}

		.enlace-veo:hover {
			opacity: 1;
		}

		/* ------------------------------------------------ */
		/* ALERTAS SIMPLES CON ESTILO ROMÁNTICO             */
		/* ------------------------------------------------ */
		#overlayAlerta {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background-color: rgba(0, 0, 0, 0.78);
			backdrop-filter: blur(3px);
			z-index: 3000;
		}

		.ventana-romantica {
			position: absolute;
			width: 270px;
			background: linear-gradient(160deg, #160c10 0%, #090607 100%);
			border: 1px solid rgba(235, 185, 198, 0.45);
			border-radius: 16px;
			padding: 28px 22px 24px 22px;
			text-align: center;
			box-shadow: 0 10px 35px rgba(220, 150, 170, 0.16);
			font-family: 'Georgia', 'Times New Roman', serif;
			animation: aparecerSuave 0.45s ease-out forwards;
		}

		@keyframes aparecerSuave {
			from {
				opacity: 0;
				transform: translateY(8px) scale(0.97);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
			}
		}

		.ornamento-romantico {
			font-size: 12px;
			color: rgba(235, 185, 198, 0.5);
			letter-spacing: 6px;
			margin-bottom: 12px;
		}

		.mensaje-romantico {
			font-size: 20px;
			font-style: italic;
			font-weight: normal;
			color: #f6e3e8;
			margin-bottom: 24px;
			letter-spacing: 1.5px;
			text-shadow: 0 0 12px rgba(246, 227, 232, 0.25);
		}

		.botones-romanticos {
			display: flex;
			justify-content: center;
			gap: 14px;
		}

		.btn-romantico {
			background-color: transparent;
			color: #e8ccd3;
			border: 1px solid rgba(235, 185, 198, 0.4);
			border-radius: 20px;
			padding: 6px 22px;
			font-family: 'Georgia', 'Times New Roman', serif;
			font-style: italic;
			font-size: 13px;
			letter-spacing: 1px;
			cursor: pointer;
			transition: all 0.3s ease;
		}

		.btn-romantico:hover {
			background-color: rgba(235, 185, 198, 0.18);
			border-color: #f6e3e8;
			color: #ffffff;
			box-shadow: 0 0 12px rgba(235, 185, 198, 0.25);
		}
	</style>
</head>
<body>

	<!-- SECCIÓN 1: TRANSICIÓN DIV 2 -> DIV 1 -->
	<div id="seccionArte">
		<div id="div2" class="caja-fullscreen activa">
			<img src="https://doctorcan.com/wp-content/uploads/2024/10/87156275_10028734-683x1024.png">
		</div>
		<div id="div1" class="caja-fullscreen"> 
			<img src="https://www.infobae.com/resizer/v2/DZ5KM4RKKVCFJOLTCVG5CFKI7Q.png?auth=1f7623943d7c39e1f0ee2b77796e0b9f274fdf152934b02d5420353c62e3fc2f&smart=true&width=992&height=558&quality=85">
		</div>
	</div>

	<!-- SECCIÓN 2: MAPA OSCURO, NIEBLA Y LINTERNA -->
	<div id="seccionMapa">
		<div class="contenedor-mapa-wrapper">
			<h2 class="titulo-arriba-mapa">¿Donde has hecho cruissing?</h2>

			<div id="mapaContenedor">
				<img id="imgMapa" src="https://bffrepositorio.unal.edu.co/server/api/core/bitstreams/d1ffd88a-eb03-4c76-b5b9-db9ff4d39569/content" alt="Mapa Universidad Nacional">
				
				<!-- Niebla y Linterna -->
				<div class="capa-niebla"></div>
				<div id="capaOscuridadLinterna"></div>

				<!-- Popup para escribir comentario en el punto exacto -->
				<div id="popupComentario">
					<input type="text" id="inputTextoMapa" placeholder="..." autocomplete="off">
					<div class="botones-popup">
						<button type="button" id="btnGuardarPin">Fijar</button>
						<button type="button" id="btnCerrarPopup">X</button>
					</div>
				</div>
			</div>

			<p class="subtitulo-abajo-mapa">ubicalo en el mapa</p>
		</div>

		<!-- Enlace inferior -->
		<div class="barra-enlace">
			<a id="btnCuandoTeVeo" class="enlace-veo">¿Cuando te veo?</a>
		</div>
	</div>

	<!-- CONTENEDOR DE ALERTAS ROMÁNTICAS -->
	<div id="overlayAlerta"></div>

	<script>
		let coordsClicActual = { xPercent: 0, yPercent: 0 };
		let estadoSeccion = 1;

		const seccionArte = document.getElementById('seccionArte');
		const seccionMapa = document.getElementById('seccionMapa');
		const div1 = document.getElementById('div1');
		const div2 = document.getElementById('div2');

		const urlHoja2 = 'https://api.sheety.co/50cfc222650c329283676702945c72c3/hojadeC/hoja2';

		// ----------------------------------------------------
		// 1. TRANSICIÓN SILENCIOSA: DIV 2 -> DIV 1 -> MAPA
		// ----------------------------------------------------
		seccionArte.addEventListener('click', () => {
			if (estadoSeccion === 1) {
				div2.classList.remove('activa');
				div1.classList.add('activa');
				estadoSeccion = 2;
			} else if (estadoSeccion === 2) {
				seccionArte.style.display = 'none';
				seccionMapa.classList.add('activa');
				document.body.style.overflow = 'auto';
			}
		});

		// ----------------------------------------------------
		// 2. EFECTO LINTERNA AMPLIADA (+50%) E ILUMINACIÓN DE TEXTOS
		// ----------------------------------------------------
		const mapaContenedor = document.getElementById('mapaContenedor');
		const capaLinterna = document.getElementById('capaOscuridadLinterna');

		mapaContenedor.addEventListener('mousemove', (e) => {
			const rect = mapaContenedor.getBoundingClientRect();
			const mouseX = e.clientX - rect.left;
			const mouseY = e.clientY - rect.top;

			capaLinterna.style.setProperty('--x', `${mouseX}px`);
			capaLinterna.style.setProperty('--y', `${mouseY}px`);

			// Radio de detección ampliado proporcionalmente a la circunferencia (130px)
			const pines = document.querySelectorAll('.pin-wrapper');
			pines.forEach(pin => {
				const pinRect = pin.getBoundingClientRect();
				const pinCenterX = pinRect.left - rect.left + (pinRect.width / 2);
				const pinCenterY = pinRect.top - rect.top + (pinRect.height / 2);
				const distancia = Math.hypot(mouseX - pinCenterX, mouseY - pinCenterY);

				if (distancia < 130) {
					pin.classList.add('iluminado');
				} else {
					pin.classList.remove('iluminado');
				}
			});
		});

		mapaContenedor.addEventListener('mouseleave', () => {
			capaLinterna.style.setProperty('--x', `-250px`);
			capaLinterna.style.setProperty('--y', `-250px`);
			document.querySelectorAll('.pin-wrapper').forEach(p => p.classList.remove('iluminado'));
		});

		// ----------------------------------------------------
		// 3. FIJAR COMENTARIOS Y PUNTOS EN COORDENADAS EXACTAS
		// ----------------------------------------------------
		const popupComentario = document.getElementById('popupComentario');
		const inputTextoMapa = document.getElementById('inputTextoMapa');
		const btnGuardarPin = document.getElementById('btnGuardarPin');
		const btnCerrarPopup = document.getElementById('btnCerrarPopup');

		mapaContenedor.addEventListener('click', function(e) {
			if (e.target.closest('#popupComentario')) return;

			const rect = mapaContenedor.getBoundingClientRect();
			const x = e.clientX - rect.left;
			const y = e.clientY - rect.top;

			coordsClicActual.xPercent = parseFloat(((x / rect.width) * 100).toFixed(4));
			coordsClicActual.yPercent = parseFloat(((y / rect.height) * 100).toFixed(4));

			popupComentario.style.left = coordsClicActual.xPercent + '%';
			popupComentario.style.top = coordsClicActual.yPercent + '%';
			popupComentario.style.display = 'block';

			inputTextoMapa.value = '';
			inputTextoMapa.focus();
		});

		btnCerrarPopup.addEventListener('click', (e) => {
			e.stopPropagation();
			popupComentario.style.display = 'none';
			inputTextoMapa.value = '';
		});

		function guardarYMostrarComentario() {
			const comentarioTexto = inputTextoMapa.value.trim();
			if (!comentarioTexto) return;

			const fechaActual = new Date().toLocaleString('es-CO');
			const xPos = coordsClicActual.xPercent;
			const yPos = coordsClicActual.yPercent;

			crearPinFijoEnMapa(comentarioTexto, xPos, yPos);

			const guardadosLocal = JSON.parse(localStorage.getItem('pines_cruissing_unal') || '[]');
			guardadosLocal.push({ comentario: comentarioTexto, x: xPos, y: yPos, fecha: fechaActual });
			localStorage.setItem('pines_cruissing_unal', JSON.stringify(guardadosLocal));

			popupComentario.style.display = 'none';
			inputTextoMapa.value = '';

			fetch(urlHoja2, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					hoja2: {
						comentario: comentarioTexto,
						fecha: fechaActual,
						x: String(xPos),
						y: String(yPos)
					}
				})
			})
			.then(res => res.json())
			.then(data => console.log('Guardado en Sheety:', data))
			.catch(err => console.error('Error Sheety:', err));
		}

		btnGuardarPin.addEventListener('click', (e) => {
			e.stopPropagation();
			guardarYMostrarComentario();
		});

		inputTextoMapa.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				e.preventDefault();
				guardarYMostrarComentario();
			}
		});

		function crearPinFijoEnMapa(texto, xPct, yPct) {
			const wrapper = document.createElement('div');
			wrapper.className = 'pin-wrapper';
			wrapper.style.left = xPct + '%';
			wrapper.style.top = yPct + '%';

			wrapper.innerHTML = `
				<div class="pin-comentario"></div>
				<div class="texto-fijo-mapa">${texto}</div>
			`;

			mapaContenedor.appendChild(wrapper);
		}

		function cargarPuntosGuardados() {
			const mapaUnicos = new Map();

			const locales = JSON.parse(localStorage.getItem('pines_cruissing_unal') || '[]');
			locales.forEach(item => {
				if (item.comentario && item.x && item.y) {
					const clave = `${item.comentario}_${item.x}_${item.y}`;
					mapaUnicos.set(clave, item);
				}
			});

			fetch(urlHoja2)
			.then(res => res.json())
			.then(json => {
				const datos = json.hoja2 || json.hoja2S || [];
				datos.forEach(item => {
					if (item.comentario) {
						let x = parseFloat(item.x);
						let y = parseFloat(item.y);

						if (isNaN(x) || isNaN(y)) {
							let hash = 0;
							for (let i = 0; i < item.comentario.length; i++) {
								hash = item.comentario.charCodeAt(i) + ((hash << 5) - hash);
							}
							x = (Math.abs(hash) % 76) + 12;
							y = (Math.abs(hash * 13) % 76) + 12;
						}

						const clave = `${item.comentario}_${x}_${y}`;
						if (!mapaUnicos.has(clave)) {
							mapaUnicos.set(clave, { comentario: item.comentario, x: x, y: y });
						}
					}
				});

				mapaUnicos.forEach(punto => {
					crearPinFijoEnMapa(punto.comentario, punto.x, punto.y);
				});
			})
			.catch(err => {
				console.log('Cargando respaldo local:', err);
				mapaUnicos.forEach(punto => {
					crearPinFijoEnMapa(punto.comentario, punto.x, punto.y);
				});
			});
		}

		cargarPuntosGuardados();

		// ----------------------------------------------------
		// 4. SECUENCIA DE ALERTAS SIMPLES Y ROMÁNTICAS
		// ----------------------------------------------------
		const btnCuandoTeVeo = document.getElementById('btnCuandoTeVeo');
		const overlayAlerta = document.getElementById('overlayAlerta');

		const mensajesRomanticos = [
			'&lt;¿?&gt;',
			'&lt;¿?¡¡¡&gt;',
			'&lt;¿seguro?&gt;'
		];

		btnCuandoTeVeo.addEventListener('click', () => {
			overlayAlerta.innerHTML = '';
			overlayAlerta.style.display = 'block';
			mostrarAlertaRomantica(0);
		});

		function mostrarAlertaRomantica(paso) {
			if (paso >= mensajesRomanticos.length) {
				window.location.href = 'cruisssing.html';
				return;
			}

			const ventana = document.createElement('div');
			ventana.className = 'ventana-romantica';

			const offsetX = (paso - 1) * 26;
			const offsetY = (paso - 1) * 24;
			ventana.style.left = `calc(50% - 135px + ${offsetX}px)`;
			ventana.style.top = `calc(50% - 75px + ${offsetY}px)`;
			ventana.style.zIndex = 3001 + paso;

			ventana.innerHTML = `
				<div class="ornamento-romantico">♡</div>
				<div class="mensaje-romantico">${mensajesRomanticos[paso]}</div>
				<div class="botones-romanticos">
					<button type="button" class="btn-romantico btn-si">sí</button>
					<button type="button" class="btn-romantico btn-no">no</button>
				</div>
			`;

			ventana.querySelector('.btn-si').addEventListener('click', () => {
				mostrarAlertaRomantica(paso + 1);
			});

			ventana.querySelector('.btn-no').addEventListener('click', () => {
				overlayAlerta.style.display = 'none';
				overlayAlerta.innerHTML = '';
			});

			overlayAlerta.appendChild(ventana);
		}
	</script>

</body>
</html>
